name: LCP Checks

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lcp-build:
    name: LCP build
    runs-on: ubuntu-latest
    environment: LCP
    env:
      LCP_REPOSITORY_URL: ${{ secrets.LCP_REPOSITORY_URL }}
      LCP_REPOSITORY_PATTERN: ${{ secrets.LCP_REPOSITORY_PATTERN }}
      LCP_DEPENDENCY: ${{ secrets.LCP_DEPENDENCY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :readium:readium-lcp:connectedAndroidTest --no-daemon --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-${{ github.run_id }}
          path: |
            **/build/reports/androidTests/connected/**
            **/build/test-results/connected/**
          retention-days: 5
