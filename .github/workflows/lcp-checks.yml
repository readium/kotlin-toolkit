name: LCP Checks

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lcp-build:
    name: LCP build
    runs-on: ubuntu-latest
    environment: LCP
    env:
      LCP_REPOSITORY_URL: ${{ secrets.LCP_REPOSITORY_URL }}
      LCP_REPOSITORY_PATTERN: ${{ secrets.LCP_REPOSITORY_PATTERN }}
      LCP_DEPENDENCY: ${{ secrets.LCP_DEPENDENCY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
      - name: Build LCP
        run: |
          ./gradlew :readium:readium-lcp:assembleDebug
